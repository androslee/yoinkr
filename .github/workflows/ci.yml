# Verification for Yoinkr. Analysis and tests run locally with no secrets, no network
# beyond the npm registry, and no deployment, so this workflow is deliberately minimal:
# least-privilege tokens, SHA-pinned actions, and no install scripts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded runs on the same ref are pointless; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for every job. No job here needs more; any job that ever does
# should raise it locally rather than widening this default.
permissions:
  contents: read

jobs:
  test:
    # The host adapters are verified only on Linux x86-64 and skip elsewhere, so the
    # ubuntu lane is the one that exercises them. macOS is here because its temp dir is
    # reached through a symlink (/var -> /private/var), which is how the path-containment
    # guards get tested against a non-canonical filesystem.
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is not needed after cloning; do not leave it in .git/config
          # where any later step or dependency could read it.
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # --ignore-scripts matches the documented install in README.md and closes the
      # arbitrary-code-on-install vector. No dependency cache: a cache restored across
      # branches is writable by any PR, and this dependency tree installs in seconds.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: CLI starts
        run: node src/cli.js --help

      - name: Unit and regression suite
        run: npm test

  repository:
    # The project's own public-repository audit: no generated or private paths, no
    # credential patterns, no large files, no broken example links.
    name: repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit repository contents
        run: node scripts/general/check-repository.mjs

  audit:
    # Gates on critical advisories only. The tree currently carries 4 high and 4 moderate
    # advisories, all transitive through the pinned rea-agents -> zod; gating on `high`
    # today would mean a permanently red build for an upstream issue. Tighten this to
    # --audit-level=high once rea-agents ships a zod bump.
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: npm audit
        run: npm audit --audit-level=critical

      # package-lock.json pins every dependency with an integrity hash. `npm ci` already
      # refuses a lockfile that disagrees with package.json; this makes a hand-edited or
      # drifted lockfile a named failure rather than a confusing install error.
      - name: Lockfile matches manifest
        run: npm ci --ignore-scripts --dry-run
