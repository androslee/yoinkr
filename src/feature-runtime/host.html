<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Recovered comparison — minimal host</title><style>body{margin:0;background:#151515;color:#eee;font-family:Arial}header{padding:12px}button{cursor:pointer}#feature{margin:12px}pre{user-select:text}</style><header>Yoinkr minimal host — original MQTT Explorer UI, explicit state adapters</header><main id="feature"></main><script type="module">
